name: daily-sync

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every day
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t optibot-sync .

      - name: Scrape and upload delta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FILE_SEARCH_STORE: ${{ secrets.FILE_SEARCH_STORE }}
        run: |
          mkdir -p output data/articles
          # The container runs as a non-root user with a different UID than the runner.
          chmod -R a+rwX output data/articles
          docker run --rm \
            -e GEMINI_API_KEY -e FILE_SEARCH_STORE \
            -v "$PWD/output:/app/output" \
            -v "$PWD/data/articles:/app/data/articles" \
            optibot-sync main.py

      - name: Upload last-run artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run
          path: |
            output/last_run.json
            data/articles/
          if-no-files-found: ignore
          retention-days: 30
